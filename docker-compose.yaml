services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    platform: linux/amd64
    container_name: grono-map-postgres
    ports:
      - ${DATABASE_PORT}:5432
    volumes:
      - ./db:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-root}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-secret}
      POSTGRES_DB: ${DATABASE_NAME:-api}
    # healthcheck:
    #   test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
    #   interval: 5s
    #   timeout: 5s
    #   retries: 5

  redis:
    image: redis:7-alpine
    container_name: grono-map-redis
    ports:
      - '6379:6379'
    # healthcheck:
    #   test: ['CMD', 'redis-cli', 'ping']
    #   interval: 5s
    #   timeout: 3s
    #   retries: 5

  maildev:
    build:
      context: ./apps/api
      dockerfile: maildev.Dockerfile
    container_name: grono-map-maildev
    ports:
      - '${MAIL_CLIENT_PORT:-1080}:1080'
      - '${MAIL_PORT:-1025}:1025'

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: grono-map-api
    ports:
      - '${APP_PORT:-3001}:3001'
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      REDIS_HOST: redis
      MAIL_HOST: maildev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      maildev:
        condition: service_started

  adminer:
    image: adminer:latest
    container_name: grono-map-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools
